<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Photo Upload</title>
</head>
<body>
    <h1>Upload Profile Photo</h1>
    <form id="profileForm" enctype="multipart/form-data">
        <label for="image">Choose Profile Photo:</label>
        <input type="file" id="image" name="image" accept="image/*" required>
        <button type="submit">Upload Photo</button>
    </form>
    
    <script>
        document.getElementById('image').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                console.log("File Name:", file.name); // Log file name
                console.log("File Type:", file.type); // Log file type
                console.log("File Size:", file.size); // Log file size
            } else {
                console.log("No file selected");
            }
        });

        document.getElementById('profileForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJVc2VyX0lEIjoiTUFSSy03MjkzNjEiLCJpYXQiOjE3MzE2Nzg5MDB9.IILJOFJGPl1186R-aiPRYYzDVLpQ74m3Chr2QDa_Ns8";
            if (!token) {
                alert("Authorization token is missing. Please log in.");
                return;
            }

            const formData = new FormData();
            const imageFile = document.getElementById('image').files[0];
            // console.log(formData)
            formData.append('image', imageFile);
            console.log(imageFile)

            try {
                const response = await fetch('/Markapi/Settings/addprofile', {
                    method: 'PUT',
                    headers: {
                        'auth-token': token 
                    },
                    body: formData
                });

                const result = await response.json();
                console.log("Response:", result);
                if (response.ok) {
                    alert("Profile photo uploaded successfully!");
                    console.log("Photo URL:", result.url);
                } else {
                    alert("Failed to upload profile photo: " + result.error);
                    console.error(result);
                }
            } catch (error) {
                console.error("Error uploading photo:", error);
            }
        });
    </script>
</body>
</html>
